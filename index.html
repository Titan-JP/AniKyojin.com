<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse | Каталог аниме</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #8a2be2; /* Фиолетовый акцент */
            --accent-hover: #9d4edd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Шапка сайта */
        header {
            background-color: var(--card-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            background-color: var(--bg-color);
            color: white;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        /* Сетка каталога */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Карточка аниме */
        .anime-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(138, 43, 226, 0.2);
        }

        .anime-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-rating {
            font-size: 14px;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            z-index: 10;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        .modal-header {
            display: flex;
            gap: 20px;
            padding: 25px;
        }

        .modal-header img {
            width: 200px;
            border-radius: 10px;
            object-fit: cover;
        }

        .modal-title-info h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .modal-title-info p {
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .modal-body {
            padding: 0 25px 25px 25px;
        }

        .player-placeholder {
            width: 100%;
            height: 350px;
            background-color: #000;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            border: 1px dashed #444;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        .player-placeholder svg {
            width: 60px;
            height: 60px;
            fill: var(--accent);
            margin-bottom: 15px;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .modal-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .modal-header img {
                width: 150px;
            }
            .player-placeholder {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AnimeVerse</div>
        <input type="text" id="searchInput" class="search-bar" placeholder="Поиск аниме...">
    </header>

    <div class="container">
        <div class="anime-grid" id="animeGrid">
            <!-- Карточки будут загружаться сюда -->
            <p style="text-align: center; width: 100%; grid-column: 1 / -1;">Загрузка каталога...</p>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="animeModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="modal-header">
                <img id="modalImg" src="" alt="Постер">
                <div class="modal-title-info">
                    <h2 id="modalTitle"></h2>
                    <p><strong>Рейтинг:</strong> <span id="modalRating" style="color: #ffd700;"></span></p>
                    <p><strong>Год:</strong> <span id="modalYear"></span></p>
                    <p><strong>Эпизоды:</strong> <span id="modalEpisodes"></span></p>
                    <p><strong>Жанры:</strong> <span id="modalGenres"></span></p>
                </div>
            </div>
            <div class="modal-body">
                <h3>Описание:</h3>
                <p id="modalDesc" style="margin-bottom: 15px; color: #ccc; line-height: 1.5;"></p>
                
                <h3>Просмотр:</h3>
                <div class="player-placeholder">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <p>Плеер будет добавлен на следующем этапе.</p>
                    <p style="font-size: 12px; margin-top: 5px;">(Для легального просмотра требуется подключение видеобалансера или встраивание легального плеера)</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Запрос к публичному API AniList (без ключей)
        const query = `
        query ($page: Int, $search: String) {
          Page (page: $page, perPage: 24) {
            media (search: $search, type: ANIME, sort: POPULARITY_DESC) {
              id
              title {
                romaji
                english
                native
              }
              coverImage {
                large
              }
              averageScore
              description
              genres
              episodes
              seasonYear
            }
          }
        }
        `;

        const grid = document.getElementById('animeGrid');
        const searchInput = document.getElementById('searchInput');
        
        // Элементы модального окна
        const modal = document.getElementById('animeModal');
        const closeModal = document.getElementById('closeModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalRating = document.getElementById('modalRating');
        const modalYear = document.getElementById('modalYear');
        const modalEpisodes = document.getElementById('modalEpisodes');
        const modalGenres = document.getElementById('modalGenres');
        const modalDesc = document.getElementById('modalDesc');

        let timeout = null;

        // Функция загрузки данных
        async function fetchAnime(searchTerm = '') {
            grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">Загрузка...</p>';
            
            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: { search: searchTerm }
                    })
                });
                
                const data = await response.json();
                renderAnime(data.data.Page.media);
            } catch (error) {
                grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">Ошибка загрузки данных. Проверьте интернет.</p>';
                console.error(error);
            }
        }

        // Функция отрисовки карточек
        function renderAnime(animeList) {
            grid.innerHTML = '';
            
            if (animeList.length === 0) {
                grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">Ничего не найдено</p>';
                return;
            }

            animeList.forEach(anime => {
                const title = anime.title.romaji || anime.title.english || anime.title.native;
                const rating = anime.averageScore ? (anime.averageScore / 10).toFixed(1) : '?';
                const cover = anime.coverImage.large;

                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <img src="${cover}" alt="${title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title" title="${title}">${title}</div>
                        <div class="card-rating">★ ${rating}</div>
                    </div>
                `;
                
                // Обработчик клика для открытия модального окна
                card.addEventListener('click', () => openModal(anime, title, rating));
                
                grid.appendChild(card);
            });
        }

        // Функция открытия модального окна
        function openModal(anime, title, rating) {
            modalImg.src = anime.coverImage.large;
            modalTitle.textContent = title;
            modalRating.textContent = rating;
            modalYear.textContent = anime.seasonYear || 'Неизвестно';
            modalEpisodes.textContent = anime.episodes || '?';
            modalGenres.textContent = anime.genres.join(', ');
            
            // Очистка HTML тегов из описания API
            const cleanDesc = anime.description ? anime.description.replace(/<[^>]*>?/gm, '') : 'Описание отсутствует.';
            modalDesc.textContent = cleanDesc;

            modal.style.display = 'flex';
        }

        // Закрытие модального окна
        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Закрытие по клику вне окна
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Обработчик поиска (с задержкой, чтобы не спамить API)
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                fetchAnime(e.target.value);
            }, 500);
        });

        // Первоначальная загрузка
        fetchAnime();
    </script>
</body>
</html>
