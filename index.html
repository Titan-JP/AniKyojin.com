<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-main:#0b0e14;--bg-card:#151a24;--bg-hover:#1e2532;--bg-nav:rgba(11,14,20,.88);--acc-cyan:#00d2ff;--acc-blue:#3b82f6;--acc-gradient:linear-gradient(135deg,#00d2ff 0%,#3b82f6 100%);--txt-primary:#f3f4f6;--txt-muted:#9ca3af;--bd-color:rgba(255,255,255,.08);--shadow-glow:0 8px 25px rgba(0,210,255,.18);--radius-lg:14px;--radius-md:10px;--radius-sm:6px}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg-main);color:var(--txt-primary);min-height:100vh;overflow-x:hidden;line-height:1.5}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg-main)}::-webkit-scrollbar-thumb{background:#2a3447;border-radius:4px}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:var(--bg-nav);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--bd-color)}
.header-left{display:flex;align-items:center;gap:32px}
.logo{font-size:1.4rem;font-weight:800;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{color:var(--acc-cyan);font-size:1.5rem;filter:drop-shadow(0 0 8px rgba(0,210,255,.6))}
.logo span{background:var(--acc-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-box{display:flex;align-items:center;background:var(--bg-card);border-radius:30px;padding:8px 18px;border:1px solid var(--bd-color);width:300px;transition:.25s}
.search-box:focus-within{border-color:var(--acc-cyan);box-shadow:0 0 15px rgba(0,210,255,.2);width:340px}
.search-box i{color:var(--txt-muted)}
.search-box input{background:transparent;border:none;color:#fff;outline:none;width:100%;margin-left:10px;font-size:.88rem;font-family:inherit}
.hero{position:relative;height:420px;margin:24px 32px;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-card);border:1px solid var(--bd-color);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:brightness(.4) saturate(1.2);transition:transform .8s}
.hero:hover .hero-bg{transform:scale(1.02)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg-main) 10%,rgba(11,14,20,.8) 50%,transparent 100%),linear-gradient(0deg,var(--bg-main) 0%,transparent 40%)}
.hero-ct{position:relative;z-index:2;padding:48px;max-width:650px;height:100%;display:flex;flex-direction:column;justify-content:center}
.hero-badges{display:flex;gap:10px;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--acc-gradient);color:#fff;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase}
.hero-ct h1{font-size:2.4rem;font-weight:800;line-height:1.2;margin-bottom:12px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tags span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#e5e7eb;padding:4px 12px;border-radius:6px;font-size:.75rem}
.synopsis{color:#d1d5db;font-size:.92rem;line-height:1.6;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-md);border:none;cursor:pointer;font-weight:700;font-size:.9rem;transition:.25s;font-family:inherit}
.btn-p{background:var(--acc-gradient);color:#fff;box-shadow:var(--shadow-glow)}
.btn-p:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn-s{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.15)}
.section{padding:0 32px 36px}
.section h2{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:18px}
.section h2 i{color:var(--acc-cyan);background:rgba(0,210,255,.1);padding:8px;border-radius:8px;font-size:1rem}
.row{display:flex;gap:18px;overflow-x:auto;padding-bottom:12px}
.card{flex:0 0 185px;background:var(--bg-card);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;border:1px solid var(--bd-color);text-decoration:none;color:inherit;transition:.3s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--acc-cyan);box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 20px rgba(0,210,255,.2)}
.card .poster{position:relative;height:260px;overflow:hidden;background:var(--bg-hover)}
.card .poster img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .poster img{transform:scale(1.08)}
.card .poster-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(21,26,36,.95) 0%,transparent 60%);opacity:.8}
.card .sc{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);padding:3px 8px;border-radius:6px;font-size:.7rem;font-weight:700;color:#facc15;display:flex;align-items:center;gap:4px}
.card .tp{position:absolute;top:8px;right:8px;background:var(--acc-gradient);padding:2px 7px;border-radius:4px;font-size:.65rem;font-weight:800;color:#fff;text-transform:uppercase}
.card .info{padding:12px;flex-grow:1}
.card .title{font-size:.85rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.card .meta{font-size:.72rem;color:var(--txt-muted);margin-top:8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.skel{height:260px;background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-hover) 50%,var(--bg-card) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:var(--radius-md)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.load{text-align:center;padding:40px;color:var(--txt-muted)}
.load i{animation:sp 1s linear infinite;display:block;margin:0 auto 12px;font-size:1.8rem;color:var(--acc-cyan)}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(5,7,10,.85);backdrop-filter:blur(12px);z-index:999;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.modal.open{display:flex}
.mbox{background:var(--bg-main);border-radius:18px;max-width:960px;width:100%;border:1px solid var(--bd-color);position:relative;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.8);animation:modalFade .3s ease}
@keyframes modalFade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.mclose{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;z-index:10;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.mclose:hover{background:#ef4444;transform:rotate(90deg)}
.mbanner{height:220px;background-size:cover;background-position:center;position:relative}
.mbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,14,20,.2) 0%,var(--bg-main) 100%)}
.mbody{padding:0 28px 28px;margin-top:-70px;position:relative;z-index:2}
.mhead{display:flex;gap:20px;margin-bottom:18px}
.mposter{flex:0 0 140px;border-radius:var(--radius-md);overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.6);border:2px solid var(--bd-color)}
.mposter img{width:100%;display:block}
.mtitle{padding-top:70px;flex-grow:1}
.mtitle h2{font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:10px}
.stats{display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem;color:var(--txt-muted);margin-bottom:12px}
.stats span{display:flex;align-items:center;gap:6px;background:var(--bg-card);padding:4px 10px;border-radius:6px;border:1px solid var(--bd-color)}
.stats i{color:var(--acc-cyan)}
.gens{display:flex;flex-wrap:wrap;gap:6px}
.gens span{background:rgba(0,210,255,.1);color:var(--acc-cyan);padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;border:1px solid rgba(0,210,255,.2)}
.syn{color:#d1d5db;font-size:.9rem;line-height:1.65;margin:16px 0;background:var(--bg-card);padding:14px 18px;border-radius:var(--radius-md);border:1px solid var(--bd-color)}
</style>

<body>
<header class="header">
  <div class="header-left">
    <a href="#" class="logo" onclick="goHome();return false"><i class="fa-solid fa-play"></i>Ani<span>KyoJin</span></a>
  </div>
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="q" placeholder="Поиск аниме..." onkeydown="if(event.key==='Enter')goSearch()">
  </div>
</header>
<div id="app"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="mbox">
    <button class="mclose" onclick="closeM()"><i class="fa-solid fa-xmark"></i></button>
    <div id="mct"></div>
  </div>
</div>

<script>
// ========== НАСТРОЙКИ ==========
// Используем публичный прокси для обхода ошибки DNS Cloudflare
const PROXY_URL = 'https://corsproxy.io/?';

// ВАШИ ДАННЫЕ ИЗ SUPABASE
const SUPABASE_URL = 'https://rqxjseopwqrbegccvtz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ISGDhFIAiMLep30jIPbgLQ_MtFhCqtb';

let supabaseClient = null;
if (SUPABASE_KEY !== 'ВАШ_КЛЮЧ_ЗДЕСЬ') {
    // Создаем клиент с кастомным fetch, который отправляет запросы через прокси
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: {
            fetch: (url, options) => {
                const proxyUrl = `${PROXY_URL}url=${encodeURIComponent(url)}`;
                return fetch(proxyUrl, options);
            }
        }
    });
}

let currentAnimeId = null;

// ========== API ФУНКЦИИ ==========
async function fetchFromProxy(targetUrl) {
    const proxyUrl = `${PROXY_URL}url=${encodeURIComponent(targetUrl)}`;
    const response = await fetch(proxyUrl, { headers: { 'User-Agent': 'AniKyoJin/1.0' } });
    if (!response.ok) throw new Error('Proxy error');
    return await response.json();
}

async function getTop() {
    try {
        const data = await fetchFromProxy('https://shikimori.one/api/animes?limit=20&order=popularity');
        return data.map(item => ({
            id: item.id,
            title: item.russian || item.name,
            img: `https://shikimori.one${item.image.original}`,
            score: (typeof item.score === 'number') ? item.score.toFixed(1) : (item.score || '?'),
            eps: item.episodes,
            year: item.aired_on ? item.aired_on.split('-')[0] : '?',
            status: item.status === 'released' ? 'Выход завершен' : 'Онгоинг',
            type: 'TV',
            syn: item.description || '',
            genres: item.genres ? item.genres.map(g => g.russian || g.name) : []
        }));
    } catch (e) {
        console.error(e);
        return [];
    }
}

function card(a) {
  return `<a class="card" href="#" onclick="openA(${a.id});return false">
  <div class="poster"><img src="${a.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'"><div class="poster-overlay"></div>
  <div class="sc"><i class="fa-solid fa-star"></i> ${a.score}</div><div class="tp">${a.type}</div></div>
  <div class="info"><div class="title">${a.title}</div><div class="meta"><span>${a.eps || "?"} Эп.</span><span>${a.year}</span></div></div></a>`;
}

async function goHome() {
  document.getElementById("app").innerHTML = `
  <div class="hero"><div class="hero-bg" id="hbg"></div><div class="hero-ct" id="hct"><div class="load"><i class="fa-solid fa-spinner"></i>Загрузка...</div></div></div>
  <div class="section"><h2><i class="fa-solid fa-fire"></i> Популярное</h2><div class="grid" id="rg"></div></div>`;
  
  const top = await getTop();
  if (top.length) {
    document.getElementById("rg").innerHTML = top.map(card).join("");
    const h = top[0];
    document.getElementById("hbg").style.backgroundImage = `url('${h.img}')`;
    document.getElementById("hct").innerHTML = `<div class="hero-badges"><span class="badge">${h.status}</span></div>
    <h1>${h.title}</h1><div class="tags">${h.genres.slice(0, 3).map(g => `<span>${g}</span>`).join("")}</div>
    <p class="synopsis">${h.syn.slice(0, 200)}...</p>
    <div class="hero-actions"><button class="btn btn-p" onclick="openA(${h.id})"><i class="fa-solid fa-play"></i> Смотреть</button></div>`;
  }
}

// ========== ОКНО АНИМЕ + ОТЗЫВЫ ==========
async function openA(id) {
  currentAnimeId = id.toString();
  document.getElementById("modal").classList.add("open");
  document.getElementById("mct").innerHTML = '<div class="load"><i class="fa-solid fa-spinner"></i>Загрузка информации...</div>';
  
  try {
    const data = await fetchFromProxy(`https://shikimori.one/api/animes/${id}`);
    const anime = {
        title: data.russian || data.name,
        img: `https://shikimori.one${data.image.original}`,
        score: (typeof data.score === 'number') ? data.score.toFixed(1) : (data.score || '?'),
        eps: data.episodes,
        year: data.aired_on ? data.aired_on.split('-')[0] : '?',
        status: data.status === 'released' ? 'Выход завершен' : 'Онгоинг',
        type: data.kind,
        syn: data.description || 'Описание отсутствует.',
        genres: data.genres ? data.genres.map(g => g.russian || g.name) : []
    };
    
    document.getElementById("mct").innerHTML = `
    <div class="mbanner" style="background-image:url('${anime.img}')"></div>
    <div class="mbody">
      <div class="mhead">
        <div class="mposter"><img src="${anime.img}" alt=""></div>
        <div class="mtitle">
          <h2>${anime.title}</h2>
          <div class="stats">
            <span><i class="fa-solid fa-star" style="color:#facc15"></i> ${anime.score}</span>
            <span><i class="fa-solid fa-tv"></i> ${anime.type}</span>
            <span><i class="fa-solid fa-film"></i> ${anime.eps || "?"} Эп.</span>
            <span><i class="fa-solid fa-calendar"></i> ${anime.year}</span>
            <span style="color:var(--acc-cyan);font-weight:700">${anime.status}</span>
          </div>
          <div class="gens">${anime.genres.map(g => `<span>${g}</span>`).join("")}</div>
        </div>
      </div>
      <div class="syn">${anime.syn}</div>

      <div style="text-align:center; padding: 20px; color: var(--txt-muted); border: 1px dashed var(--bd-color); border-radius: 10px; margin-bottom: 20px;">
          <i class="fa-solid fa-video" style="font-size: 2rem; margin-bottom: 10px; color: var(--acc-cyan)"></i>
          <p>Плеер появится на следующем этапе.</p>
      </div>

      <div class="interaction-section" style="background: var(--bg-card); padding: 20px; border-radius: 10px; border: 1px solid var(--bd-color);">
          <h3 style="margin-bottom: 15px; color: var(--acc-cyan);">Ваш отзыв</h3>
          
          <div id="authSection" style="margin-bottom: 15px;">
              <p style="font-size: 0.85rem; color: var(--txt-muted); margin-bottom: 10px;">Войдите, чтобы оставить комментарий:</p>
              <div id="telegram-container"></div>
          </div>
          
          <div id="loggedInSection" style="display: none; margin-bottom: 15px;">
              <span>Вы вошли как: <b id="currentUserName" style="color: var(--acc-cyan);"></b></span>
              <button onclick="logout()" style="margin-left: 10px; background: transparent; border: 1px solid #444; color: #ccc; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem;">Выйти</button>
          </div>

          <div style="display: flex; gap: 10px; margin-bottom: 15px;">
              <select id="ratingSelect" style="padding: 10px; border-radius: 5px; background: #111; color: white; border: 1px solid #444;">
                  <option value="10">10 ★</option>
                  <option value="9">9 ★</option>
                  <option value="8">8 ★</option>
                  <option value="7">7 ★</option>
                  <option value="6">6 ★</option>
                  <option value="5">5 ★</option>
                  <option value="4">4 ★</option>
                  <option value="3">3 ★</option>
                  <option value="2">2 ★</option>
                  <option value="1">1 ★</option>
              </select>
              <button class="btn btn-p" onclick="submitRating()" style="padding: 10px 15px; font-size: 0.85rem;">Оценить</button>
          </div>

          <h4 style="margin-bottom: 10px;">Комментарии</h4>
          <div id="commentsList" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto; font-size: 0.9rem;"></div>
          
          <div style="display: flex; gap: 10px;">
              <input type="text" id="commentInput" placeholder="Написать комментарий..." style="flex: 1; padding: 10px; border-radius: 5px; background: #111; border: 1px solid #444; color: white;">
              <button class="btn btn-p" onclick="submitComment()" style="padding: 10px 15px; font-size: 0.85rem;">Отправить</button>
          </div>
      </div>

    </div>`;

    checkAuth();
    loadCommentsAndRatings();

  } catch (e) {
    console.error(e);
    document.getElementById("mct").innerHTML = '<div class="load">Ошибка загрузки информации.</div>';
  }
}

function closeM() { document.getElementById("modal").classList.remove("open"); }

// ========== АВТОРИЗАЦИЯ (TELEGRAM) ==========
function onTelegramAuth(user) {
    fetch(`${PROXY_URL}/verify-telegram`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
    })
    .then(res => res.json())
    .then(data => {
        if (data.verified) {
            localStorage.setItem('anime_user', data.username);
            checkAuth();
            alert('Вход через Telegram успешен!');
        } else {
            alert('Ошибка проверки Telegram');
        }
    })
    .catch(err => alert('Ошибка сети: ' + err.message));
}

function logout() {
    localStorage.removeItem('anime_user');
    checkAuth();
}

function checkAuth() {
    const user = localStorage.getItem('anime_user');
    const authSection = document.getElementById('authSection');
    const loggedInSection = document.getElementById('loggedInSection');
    
    if (user) {
        authSection.style.display = 'none';
        loggedInSection.style.display = 'block';
        document.getElementById('currentUserName').textContent = user;
    } else {
        authSection.style.display = 'block';
        loggedInSection.style.display = 'none';
        
        const container = document.getElementById('telegram-container');
        container.innerHTML = '';
        const script = document.createElement('script');
        script.async = true;
        script.src = "https://telegram.org/js/telegram-widget.js?22";
        script.setAttribute('data-telegram-login', 'AniKyoJinAuthBot');
        script.setAttribute('data-size', 'medium');
        script.setAttribute('data-onauth', 'onTelegramAuth(user)');
        script.setAttribute('data-request-access', 'write');
        container.appendChild(script);
    }
}

// ========== БАЗА ДАННЫХ (SUPABASE) ==========
async function loadCommentsAndRatings() {
    const list = document.getElementById('commentsList');
    list.innerHTML = 'Загрузка...';
    
    if (!supabaseClient) {
        list.innerHTML = '<p style="color: red;">База данных не подключена (вставьте ключ).</p>';
        return;
    }

    const { data, error } = await supabaseClient.from('comments').select('*').eq('anime_id', currentAnimeId).order('created_at', { ascending: false });
    
    if (error) { list.innerHTML = 'Ошибка загрузки: ' + error.message; return; }
    if (data.length === 0) { list.innerHTML = '<p style="color: #666;">Пока нет комментариев.</p>'; return; }

    list.innerHTML = data.map(c => `<div style="border-bottom: 1px solid #333; padding: 10px 0;"><div style="font-weight: bold; color: var(--acc-cyan);">${c.user_name}</div><div style="margin: 5px 0; color: #ccc;">${c.text}</div></div>`).join('');
}

async function submitComment() {
    const user = localStorage.getItem('anime_user');
    if (!user) { alert('Сначала войдите через Telegram!'); return; }
    const text = document.getElementById('commentInput').value.trim();
    if (!text) return;

    if (!supabaseClient) { alert('База данных не подключена!'); return; }

    const { error } = await supabaseClient.from('comments').insert([{ anime_id: currentAnimeId, user_name: user, text: text }]);
    if (error) { alert('Ошибка: ' + error.message); } else {
        document.getElementById('commentInput').value = '';
        loadCommentsAndRatings();
    }
}

async function submitRating() {
    const user = localStorage.getItem('anime_user');
    if (!user) { alert('Сначала войдите через Telegram!'); return; }
    const score = parseInt(document.getElementById('ratingSelect').value);
    
    if (!supabaseClient) { alert('База данных не подключена!'); return; }

    const { error } = await supabaseClient.from('ratings').upsert({ anime_id: currentAnimeId, user_name: user, score: score }, { onConflict: 'anime_id, user_name' });
    if (error) { alert('Ошибка: ' + error.message); } else { alert('Оценка сохранена!'); }
}

// Запуск
goHome();
</script>
</body>
</html>
