<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniKyoJin | Каталог аниме</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff;
            --text-muted: #a0a0a0; --accent: #8a2be2; --accent-hover: #9d4edd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }
        
        header { background-color: var(--card-bg); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .logo { font-size: 28px; font-weight: bold; color: var(--accent); text-transform: uppercase; }
        .search-bar { width: 100%; max-width: 600px; padding: 12px 20px; border-radius: 30px; border: 1px solid #333; background-color: var(--bg-color); color: white; outline: none; }
        .search-bar:focus { border-color: var(--accent); }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        
        .anime-card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.3s; }
        .anime-card:hover { transform: translateY(-5px); }
        .anime-card img { width: 100%; height: 300px; object-fit: cover; background-color: #333; }
        .card-info { padding: 15px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-rating { color: #ffd700; font-size: 14px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background-color: var(--card-bg); border-radius: 15px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 25px; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; cursor: pointer; color: white; }
        
        .modal-header { display: flex; gap: 20px; margin-bottom: 20px; }
        .modal-header img { width: 200px; border-radius: 10px; }
        .modal-title-info h2 { color: var(--accent); margin-bottom: 10px; }
        
        .player-placeholder { width: 100%; height: 300px; background-color: #000; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #666; margin: 20px 0; border: 1px dashed #444; }
        
        .interaction-section { background: #252525; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .auth-box { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .auth-box input { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #111; color: white; flex: 1; }
        .btn { padding: 10px 15px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: var(--accent-hover); }
        
        .comment-item { border-bottom: 1px solid #333; padding: 10px 0; }
        .comment-user { font-weight: bold; color: var(--accent); }
        .comment-text { margin: 5px 0; color: #ccc; }
        
        @media (max-width: 600px) { .modal-header { flex-direction: column; align-items: center; text-align: center; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">AniKyoJin</div>
        <input type="text" id="searchInput" class="search-bar" placeholder="Поиск аниме...">
    </header>

    <div class="container">
        <div class="anime-grid" id="animeGrid"><p style="text-align: center; width: 100%;">Загрузка...</p></div>
    </div>

    <div class="modal-overlay" id="animeModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="modal-header">
                <img id="modalImg" src="" alt="Постер">
                <div class="modal-title-info">
                    <h2 id="modalTitle"></h2>
                    <p><strong>Рейтинг:</strong> <span id="modalRating" style="color: #ffd700;"></span></p>
                    <p><strong>Жанры:</strong> <span id="modalGenres"></span></p>
                </div>
            </div>
            <div class="modal-body">
                <p id="modalDesc" style="margin-bottom: 15px; color: #ccc;"></p>
                <div class="player-placeholder">Видеоплеер появится позже</div>
                
                <!-- Блок для оценок и комментариев -->
                <div class="interaction-section">
                    <h3>Ваш отзыв</h3>
                    <div class="auth-box" id="authSection">
                        <input type="text" id="userNameInput" placeholder="Ваше имя (для входа)">
                        <button class="btn" onclick="saveUser()">Войти</button>
                    </div>
                    <div id="loggedInSection" style="display: none; margin-bottom: 15px;">
                        <span>Вы вошли как: <b id="currentUserName"></b></span>
                        <button class="btn" style="padding: 5px 10px; font-size: 12px; margin-left: 10px;" onclick="logout()">Выйти</button>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <select id="ratingSelect" style="padding: 10px; border-radius: 5px; background: #111; color: white; border: 1px solid #444;">
                            <option value="10">10 ★</option>
                            <option value="9">9 ★</option>
                            <option value="8">8 ★</option>
                            <option value="7">7 ★</option>
                            <option value="6">6 ★</option>
                            <option value="5">5 ★</option>
                            <option value="4">4 ★</option>
                            <option value="3">3 ★</option>
                            <option value="2">2 ★</option>
                            <option value="1">1 ★</option>
                        </select>
                        <button class="btn" onclick="submitRating()">Оценить</button>
                    </div>

                    <h4>Комментарии</h4>
                    <div id="commentsList" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;"></div>
                    
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="commentInput" placeholder="Написать комментарий..." style="flex: 1; padding: 10px; border-radius: 5px; background: #111; border: 1px solid #444; color: white;">
                        <button class="btn" onclick="submitComment()">Отправить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 1. ВАШИ ДАННЫЕ ИЗ SUPABASE ===
        const SUPABASE_URL = 'https://rqxjseopwqrbegccvtz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ISGDhFlAiMLep30jIPbgLQ_MtFhCqtb';
        
        let supabaseClient = null;
        if (SUPABASE_KEY !== 'ВСТАВЬТЕ_СЮДА_ВАШ_КЛЮЧ_НАЧИНАЮЩИЙСЯ_НА_sb_publishable') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // === 2. РАБОТА С АНИМЕ (AniList) ===
        const query = `
        query ($page: Int, $search: String) {
          Page (page: $page, perPage: 24) {
            media (search: $search, type: ANIME, sort: POPULARITY_DESC) {
              id title { romaji english } coverImage { large } averageScore description genres
            }
          }
        }`;

        const grid = document.getElementById('animeGrid');
        const searchInput = document.getElementById('searchInput');
        let timeout = null;
        let currentAnimeId = null;

        async function fetchAnime(searchTerm = '') {
            grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">Загрузка...</p>';
            try {
                // ИСПОЛЬЗУЕМ ПРОКСИ ДЛЯ ОБХОДА БЛОКИРОВОК
                const response = await fetch('https://api.allorigins.win/raw?url=https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ query: query, variables: { search: searchTerm } })
                });
                const data = await response.json();
                
                if (data && data.data && data.data.Page.media.length > 0) {
                    renderAnime(data.data.Page.media);
                } else {
                    grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">Ничего не найдено (или ошибка API).</p>';
                }
            } catch (error) {
                grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">Ошибка подключения к API. Попробуйте позже.</p>';
            }
        }

        function renderAnime(animeList) {
            grid.innerHTML = '';
            animeList.forEach(anime => {
                const title = anime.title.romaji || anime.title.english || 'Без названия';
                const cover = anime.coverImage ? anime.coverImage.large : 'https://via.placeholder.com/200x300?text=No+Image';
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `<img src="${cover}" alt="${title}" loading="lazy"><div class="card-info"><div class="card-title">${title}</div><div class="card-rating">★ ${anime.averageScore ? (anime.averageScore / 10).toFixed(1) : '?'}</div></div>`;
                card.onclick = () => openModal(anime, title);
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => fetchAnime(e.target.value), 500);
        });

        // === 3. МОДАЛЬНОЕ ОКНО И ВЗАИМОДЕЙСТВИЕ ===
        const modal = document.getElementById('animeModal');
        document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        function openModal(anime, title) {
            currentAnimeId = anime.id.toString();
            document.getElementById('modalImg').src = anime.coverImage ? anime.coverImage.large : '';
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalRating').textContent = anime.averageScore ? (anime.averageScore / 10).toFixed(1) : '?';
            document.getElementById('modalGenres').textContent = anime.genres ? anime.genres.join(', ') : '';
            document.getElementById('modalDesc').textContent = anime.description ? anime.description.replace(/<[^>]*>?/gm, '') : 'Описание отсутствует.';
            
            checkAuth();
            loadCommentsAndRatings();
            modal.style.display = 'flex';
        }

        // === 4. АВТОРИЗАЦИЯ (Имитация через LocalStorage) ===
        function saveUser() {
            const name = document.getElementById('userNameInput').value.trim();
            if (name) {
                localStorage.setItem('anime_user', name);
                checkAuth();
            }
        }
        function logout() {
            localStorage.removeItem('anime_user');
            checkAuth();
        }
        function checkAuth() {
            const user = localStorage.getItem('anime_user');
            if (user) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('loggedInSection').style.display = 'block';
                document.getElementById('currentUserName').textContent = user;
            } else {
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('loggedInSection').style.display = 'none';
            }
        }

        // === 5. КОММЕНТАРИИ И РЕЙТИНГИ (Supabase) ===
        async function loadCommentsAndRatings() {
            const list = document.getElementById('commentsList');
            list.innerHTML = 'Загрузка...';
            
            if (!supabaseClient) {
                list.innerHTML = '<p style="color: red;">База данных не подключена (вставьте ключ Supabase в код).</p>';
                return;
            }

            const { data, error } = await supabaseClient.from('comments').select('*').eq('anime_id', currentAnimeId).order('created_at', { ascending: false });
            
            if (error) { list.innerHTML = 'Ошибка загрузки: ' + error.message; return; }
            if (data.length === 0) { list.innerHTML = '<p style="color: #666;">Пока нет комментариев.</p>'; return; }

            list.innerHTML = data.map(c => `<div class="comment-item"><div class="comment-user">${c.user_name}</div><div class="comment-text">${c.text}</div></div>`).join('');
        }

        async function submitComment() {
            const user = localStorage.getItem('anime_user');
            if (!user) { alert('Сначала войдите (введите имя)!'); return; }
            const text = document.getElementById('commentInput').value.trim();
            if (!text) return;

            if (!supabaseClient) { alert('База данных не подключена!'); return; }

            const { error } = await supabaseClient.from('comments').insert([{ anime_id: currentAnimeId, user_name: user, text: text }]);
            if (error) { alert('Ошибка: ' + error.message); } else {
                document.getElementById('commentInput').value = '';
                loadCommentsAndRatings();
            }
        }

        async function submitRating() {
            const user = localStorage.getItem('anime_user');
            if (!user) { alert('Сначала войдите (введите имя)!'); return; }
            const score = parseInt(document.getElementById('ratingSelect').value);
            
            if (!supabaseClient) { alert('База данных не подключена!'); return; }

            const { error } = await supabaseClient.from('ratings').upsert({ anime_id: currentAnimeId, user_name: user, score: score }, { onConflict: 'anime_id, user_name' });
            if (error) { alert('Ошибка: ' + error.message); } else { alert('Оценка сохранена!'); }
        }

        // Инициализация
        fetchAnime();
    </script>
</body>
</html>
